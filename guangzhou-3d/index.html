<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>广州 3D 漫游</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <canvas id="scene"></canvas>

    <div id="panel">
      <h1>广州 3D 漫游</h1>
      <div class="actions">
        <button id="btn-overview">返回全景</button>
        <button id="btn-daynight">切换到夜晚</button>
      </div>
      <div id="landmark-list"></div>
    </div>

    <div id="info-card" class="hidden">
      <button id="info-close" title="关闭">×</button>
      <h2 id="info-name"></h2>
      <p id="info-cat"></p>
      <p id="info-desc"></p>
    </div>

    <canvas id="minimap" width="180" height="180"></canvas>

    <div id="hint">拖动鼠标环视 · WASD 移动 · Space/C 升降 · Shift 加速 · 点击建筑查看详情</div>
  </div>

  <script src="js/lib/three.min.js"></script>
  <script src="js/city.js"></script>
  <script src="js/landmarks.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
