<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="data:,">
    <title>太阳系星球运行预览</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            background: #000;
            font-family: 'Microsoft YaHei', Arial, sans-serif;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
        }

        #info-panel {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            padding: 20px;
            color: #fff;
            z-index: 100;
            min-width: 280px;
            backdrop-filter: blur(10px);
        }

        #info-panel h1 {
            font-size: 22px;
            margin-bottom: 15px;
            background: linear-gradient(90deg, #ffd700, #ff8c00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        #info-panel .control-item {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
            font-size: 14px;
        }

        #info-panel .control-item label {
            margin-right: 12px;
            color: #aaa;
        }

        #info-panel input[type="range"] {
            flex: 1;
            accent-color: #ffd700;
        }

        #info-panel .speed-value {
            color: #ffd700;
            min-width: 40px;
            text-align: right;
        }

        #planet-info {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.75);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            padding: 15px 30px;
            color: #fff;
            z-index: 100;
            display: none;
            backdrop-filter: blur(10px);
            text-align: center;
        }

        #planet-info h2 {
            font-size: 20px;
            color: #ffd700;
            margin-bottom: 5px;
        }

        #planet-info p {
            font-size: 13px;
            color: #ccc;
        }

        #legend {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            padding: 15px;
            color: #fff;
            z-index: 100;
            backdrop-filter: blur(10px);
        }

        #legend h3 {
            font-size: 14px;
            color: #ffd700;
            margin-bottom: 10px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            font-size: 13px;
            margin-bottom: 6px;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .legend-item:hover {
            opacity: 0.7;
        }

        .legend-color {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            margin-right: 8px;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        #btn-toggle-orbits,
        #btn-toggle-scale {
            display: block;
            width: 100%;
            margin-top: 12px;
            padding: 8px;
            background: rgba(255, 215, 0, 0.2);
            border: 1px solid #ffd700;
            color: #ffd700;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.3s;
        }

        #btn-toggle-orbits:hover,
        #btn-toggle-scale:hover {
            background: rgba(255, 215, 0, 0.4);
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>

    <div id="info-panel">
        <h1>太阳系运行预览</h1>
        <div class="control-item">
            <label>公转速度</label>
            <input type="range" id="orbit-speed" min="0" max="100" value="30">
            <span class="speed-value" id="orbit-speed-val">1.0x</span>
        </div>
        <div class="control-item">
            <label>自转速度</label>
            <input type="range" id="spin-speed" min="0" max="100" value="50">
            <span class="speed-value" id="spin-speed-val">1.0x</span>
        </div>
        <div class="control-item">
            <label>时间倍率</label>
            <input type="range" id="time-scale" min="1" max="50" value="10">
            <span class="speed-value" id="time-scale-val">10x</span>
        </div>
        <button id="btn-toggle-orbits">隐藏轨道线</button>
        <button id="btn-toggle-scale">切换真实比例</button>
    </div>

    <div id="legend">
        <h3>行星图例（点击聚焦）</h3>
        <div id="legend-list"></div>
    </div>

    <div id="planet-info">
        <h2 id="planet-name"></h2>
        <p id="planet-desc"></p>
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
    }
    </script>
    <script type="module" src="app.js"></script>
</body>
</html>
